binds:
  - port: 3111
    listeners:
      - routes:
          - backends:
              - mcp:
                  targets:
                    - name: stock-exchange
                      stdio:
                        cmd: "C:\\Users\\SarveshTalele\\Downloads\\MCP-SERVER\\backend\\.venv\\Scripts\\python.exe"
                        args: ["-m", "mcp_server.server"]
                        env:
                          DATA_API_BASE_URL: "http://127.0.0.1:8000"
                          PYTHONPATH: "C:\\Users\\SarveshTalele\\Downloads\\MCP-SERVER\\backend"
                policies:
                  mcpAuthorization:
                    rules:
                      - 'mcp.tool.name == "get_company"'
                      - 'mcp.tool.name == "search_companies"'
                      - 'mcp.tool.name == "list_sectors"'
                      - 'mcp.tool.name == "get_filings"'
                      - 'mcp.tool.name == "get_latest_filing"'
                      - 'mcp.tool.name == "calc_financial_ratios"'
                      - 'mcp.tool.name == "calc_revenue_growth"'
                      - 'mcp.tool.name == "compare_companies"'
                      - 'mcp.tool.name == "sector_ranking"'
            policies:
              cors:
                # Allow all origins so native (non-browser) clients such as
                # Claude Desktop's mcp-remote bridge, Antigravity IDE's HTTP
                # client, and the Python mcp library can connect without CORS
                # rejections. All traffic is localhost-only so "*" is safe here.
                allowOrigins:
                  - "http://localhost:15000"
                  - "http://localhost:3000"
                  - "http://localhost:3001"
                  - "http://127.0.0.1:3000"
                  - "http://127.0.0.1:15000"
                  - "*"
                allowHeaders:
                  - "content-type"
                  - "mcp-session-id"
                  - "authorization"
                  - "accept"
                  - "mcp-protocol-version"
                allowMethods: ["GET", "POST", "DELETE", "OPTIONS"]
                exposeHeaders: ["mcp-session-id"]
                # allowCredentials cannot be true when allowOrigins contains "*";
                # set it only for specific origins. Leave false for wildcard.
                allowCredentials: false

# Persist every MCP call to a local SQLite file so the gateway UI dashboard
# shows full call history across restarts, not just the current live session.
