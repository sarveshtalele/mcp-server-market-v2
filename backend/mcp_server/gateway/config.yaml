# agentgateway — the single chokepoint every MCP consumer passes through.
#
# Claude Desktop, Claude Code, VS Code Copilot, Antigravity and this project's
# own web agent all connect to :3111, never to the backend's /mcp directly.
# That is the only reason a tool call made inside a Claude Desktop chat can show
# up in the same audit view as one made from the web UI.
#
# Start it with:  python scripts/dev.py gateway
# Requires agentgateway >= 1.4.1 (1.4 added MCP 2026-07-28 support).

binds:
  - port: 3111
    listeners:
      - routes:
          - backends:
              # The backend serves MCP over Streamable HTTP at :8000/mcp.
              # It used to be spawned here as a stdio child, which meant this
              # file carried absolute interpreter paths and only worked on one
              # machine. Targeting it over HTTP makes the config portable and
              # lets either process restart independently.
              - mcp:
                  targets:
                    - name: mcp-market-mcp-server
                      mcp:
                        host: http://127.0.0.1:8000/mcp

                # ---------------------------------------------------------
                # Previous stdio target, kept for one release so reverting is
                # a two-line edit (see IMPLEMENTATION_PLAN.md C.7):
                #
                #   - stdio:
                #       cmd: "<absolute path to python>"
                #       args: ["-m", "mcp_server.server"]
                # ---------------------------------------------------------

                policies:
                  # Tool allowlist. This is the governance surface: adding a
                  # tool to the server does NOT make it callable until it is
                  # listed here. Keep in sync with the nine tools the server
                  # exposes — tests/test_observability.py asserts they match.
                  mcpAuthorization:
                    rules:
                      - 'mcp.tool.name == "get_company"'
                      - 'mcp.tool.name == "search_companies"'
                      - 'mcp.tool.name == "list_sectors"'
                      - 'mcp.tool.name == "get_filings"'
                      - 'mcp.tool.name == "get_latest_filing"'
                      - 'mcp.tool.name == "calc_financial_ratios"'
                      - 'mcp.tool.name == "calc_revenue_growth"'
                      - 'mcp.tool.name == "compare_companies"'
                      - 'mcp.tool.name == "sector_ranking"'
                      - 'mcp.tool.name == "list_market_resources"'
                      - 'mcp.tool.name == "read_market_resource"'

            policies:
              cors:
                # Explicit origins only. This affects browser callers (the
                # gateway playground, the Next.js UI); native clients such as
                # Claude Desktop send no preflight at all, so CORS has no
                # bearing on whether they can connect.
                allowOrigins:
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                  - "http://localhost:15000"
                  - "http://127.0.0.1:15000"
                allowHeaders:
                  - "content-type"
                  - "accept"
                  - "authorization"
                  - "mcp-protocol-version"
                  - "mcp-method"
                  - "mcp-name"
                # No mcp-session-id: sessions were removed from the transport
                # in the 2026-07-28 revision, so allowing or exposing that
                # header would be advertising something that no longer exists.
                allowMethods: ["GET", "POST", "OPTIONS"]
                allowCredentials: false
